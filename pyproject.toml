[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensical-alloy-docs"
version = "0.1.0"
description = "Public documentation site for Zensical Alloy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "zensical>=0.0.40",
  "zensical-alloy>=0.2.0,<0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["zensical_alloy_docs"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/zensical.toml",
  "/docs",
  "/zensical_alloy_docs",
]
